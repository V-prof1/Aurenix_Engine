<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1e2b"><title>Lacres da Bruma | Aurenix Engine</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1a28;touch-action:none;font-family:system-ui;color:#eaf8ff}#game{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;user-select:none}.joystick{position:absolute;left:24px;bottom:calc(32px + env(safe-area-inset-bottom,0px));width:122px;height:122px;border:2px solid #b9dded55;border-radius:50%;background:#ffffff17;pointer-events:auto;touch-action:none}.stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#91f1ec88;border:2px solid #d5fffa88}.action{pointer-events:auto;position:absolute;right:25px;bottom:calc(54px + env(safe-area-inset-bottom,0px));width:79px;height:79px;border-radius:50%;background:#3e7d91a0;color:#f0ffff;border:2px solid #9be6ff70;font-size:21px;font-weight:800;touch-action:none}.action2{right:115px;bottom:calc(31px + env(safe-area-inset-bottom,0px));width:49px;height:49px;background:#60639a99;font-size:14px}.gameerror{position:fixed;z-index:500;top:15%;left:10%;right:10%;background:#6f3049e9;color:white;white-space:pre-wrap;padding:15px;border-radius:12px}@media(hover:hover) and (pointer:fine){.joystick,.action{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud" class="hud"><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><button id="jumpBtn" class="action" aria-label="Ataque">⚔</button><button id="actionBtn" class="action action2" aria-label="Interagir">✦</button></div><script src="../../js/runtime.js"></script><script>fetch("./lacres-da-bruma.aurenix.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(game=>{if(!window.AurenixRuntime)throw Error("Runtime não disponível");window.AurenixRuntime.startGame(game);}).catch(e=>{document.body.insertAdjacentHTML("beforeend",'<div class="gameerror">Erro ao carregar Lacres da Bruma: '+String(e.message).replace(/[<>]/g,"")+"</div>");});</script></body></html>
