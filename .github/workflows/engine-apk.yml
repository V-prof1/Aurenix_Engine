name: APK da Aurenix Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - studio.html
      - pixelstudio.html
      - style.css
      - js/**
      - tests/**
      - assets/**
      - package.json
      - capacitor.config.json
      - manifest.webmanifest
      - sw.js
      - .github/workflows/engine-apk.yml
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android 36
        run: |
          SDK_BIN="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          test -n "$SDK_BIN"
          "$SDK_BIN" "platforms;android-36" "build-tools;36.0.0"
      - name: Validar código JavaScript
        run: node --check js/blocks.js && node --check js/editor-patch.js && node --check js/runtime.js && node --check js/editor.js && node --check js/tutorials-data.js && node --check js/tutorials.js && node --check js/home.js && node --check js/file-save.js && node --check js/gizmo3d.js && node --check js/audio.js && node --check js/theme.js && node --check js/back.js && node --check js/axis3d.js && node --check js/studio07.js && node --check js/studio08.js && node --check js/toolbox08.js && node --check js/mobile09.js && node --check js/github-build.js && node --check js/github-account.js && node --check js/github-publisher-ui.js && node --check js/cloud-drive.js && node --check js/cloud-auth.js && node --check js/cloud-ui.js && node --check js/character3d.js && node --check js/character-face13.js && node --check js/character-motion14.js && node --check js/character-tracks16.js && node --check js/character-symmetry16.js && node --check js/advanced17-core.js && node --check js/advanced17-editor.js && node --check js/import17.js && node --check js/gltf18-rig.js && node --check js/gltf19.js && node --check js/model-touch14.js && node --check js/modelstudio.js && node --check js/model-bridge.js && node --test tests/*.test.cjs
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund
      - name: Preparar site da engine
        run: |
          mkdir -p www
          cp index.html studio.html pixelstudio.html modelstudio.html style.css manifest.webmanifest sw.js www/
          cp -R js assets www/
      - name: Criar plataforma Android
        run: npx cap add android && npx cap sync android
      - name: Restaurar assinatura Android estavel (opcional)
        env:
          AURENIX_KEYSTORE: ${{ secrets.AURENIX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AURENIX_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$AURENIX_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Keystore persistente carregada de segredo do GitHub."
          else
            echo "Usando keystore de debug temporaria. Para login Google Android, configure o segredo com assinatura estavel."
          fi
      - name: Cache das dependências Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aurenix-gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            aurenix-gradle-${{ runner.os }}-
      - name: Compilar APK de testes
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Aurenix Gradle tentativa $attempt"
            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            echo "Falha de rede/Gradle; aguardando antes da próxima tentativa"
            sleep $((attempt * 35))
          done
          exit 1
      - name: Mostrar SHA-1 do APK para OAuth Google
        run: |
          echo "Fingerprint do APK Android (para cadastrar no Google Cloud):"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -n "$APK_SIGNER" ]; then
            "$APK_SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA-1 digest|SHA-256 digest' || true
          else
            echo "Ferramenta apksigner indisponivel. Leia a assinatura diretamente do APK."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Aurenix-Engine-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
