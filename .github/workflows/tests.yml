name: Validar engine web
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check js/runtime.js
          node --check js/editor.js
          node --check js/advanced17-core.js
          node --check js/advanced17-editor.js
          node --check js/import17.js
          node --check js/gltf18-rig.js
          node --check js/tutorials-data.js
          node --check js/tutorials.js
          node --check js/character-tracks16.js
          node --check js/character-symmetry16.js
          node --check js/blocks.js
          node --check js/editor-patch.js
          node --test tests/*.test.cjs
