name: APK do jogo (game-web)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Conferir jogo HTML
        run: test -f game-web/index.html
      - name: Preparar jogo
        run: |
          mkdir -p game-build/www
          cp -R game-web/. game-build/www/
          cp package.json game-build/package.json
          printf '%s\n' '{"appId":"com.aurenix.meujogo","appName":"Meu Jogo Aurenix","webDir":"www","server":{"androidScheme":"https"}}' > game-build/capacitor.config.json
      - name: Compilar APK de teste
        working-directory: game-build
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aurenix-Jogo-APK-debug
          path: game-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
